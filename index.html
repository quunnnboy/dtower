<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a1a1a">

  <title>Dice Tower Controller</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #1a1a1a; color: #fff; }
    button { display: block; width: 80%; max-width: 300px; margin: 12px auto; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
    .btn-connect { background: #2196F3; color: white; }
    .btn-red { background: #e53935; color: white; }
    .btn-blue { background: #1e88e5; color: white; }
    .btn-fire { background: #fb8c00; color: white; }
    .btn-rainbow { background: linear-gradient(45deg, #f06, #4a90e2); color: white; }
    .btn-crit { background: #ffd700; color: black; }
    .btn-off { background: #424242; color: white; }
  </style>
</head>
<body>

  <h2>🎲 Dice Tower Controller</h2>
  <button class="btn-connect" onclick="connectBLE()">🔗 Verbind met Toren</button>

  <hr style="margin: 20px 0; border: 0.5px solid #333;">

  <button class="btn-red" onclick="sendCommand('RED')">Rood Licht</button>
  <button class="btn-blue" onclick="sendCommand('BLUE')">Blauw Licht</button>
  <button class="btn-fire" onclick="sendCommand('FIRE')">🔥 Vuur Effect</button>
  <button class="btn-rainbow" onclick="sendCommand('RAINBOW')">🌈 Rainbow Cycle</button>
  <button class="btn-crit" onclick="sendCommand('CRIT')">✨ Natural 20 Flash</button>
  <button class="btn-off" onclick="sendCommand('OFF')">Uitzetten</button>

  <script>
    // Activeer de Service Worker voor offline gebruik
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Offline modus is geactiveerd!'))
        .catch(err => console.error('Service Worker fout:', err));
    }
  </script>
  
  <script>
    // Exact dezelfde Nordic UART Service UUID's als in je ESP32 C++ code:
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    let rxCharacteristic = null;

    async function connectBLE() {
      try {
        console.log("Zoeken naar DiceTower_Skull...");
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'DiceTower_Skull' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(RX_CHAR_UUID);
        
        alert("Succesvol verbonden met de Dice Tower!");
      } catch (error) {
        console.error("Verbinding mislukt:", error);
        alert("Fout bij verbinden: " + error);
      }
    }

    async function sendCommand(command) {
      if (!rxCharacteristic) {
        alert("Verbind eerst via Bluetooth!");
        return;
      }
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(command));
        console.log("Verzonden:", command);
      } catch (error) {
        console.error("Verzenden mislukt:", error);
      }
    }
  </script>
</body>
</html>
